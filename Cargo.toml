[package]
name = "astralia-shell-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "astralia"
path = "src/main.rs"

[dependencies]
calloop = { version = "0.14", features = ["signals", "executor"] }
glow = "0.16"
khronos-egl = { version = "6", features = ["static"] }
libc = "0.2"
log = "0.4"
pangocairo = "0.22"
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-egl = "0.32"
wayland-scanner = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
bitflags = "2"
zbus = "5"
async-io = "2"
blocking = "1"
async-channel = "2"
futures-lite = "2"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
pipewire = "0.9"
resvg = { version = "0.45", default-features = false }
ffmpeg-sys-next = { version = "=9.1.1", optional = true, default-features = false, features = ["avcodec", "avformat", "avfilter"] }

[features]
default = ["video"]
video = ["dep:ffmpeg-sys-next"]

[dev-dependencies]
tempfile = "3"
libc = "0.2"

[profile.release]
lto = true
